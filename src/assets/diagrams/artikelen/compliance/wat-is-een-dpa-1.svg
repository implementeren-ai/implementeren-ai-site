<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Beslisschema in vier stappen: gaan er geen persoonsgegevens naar de leverancier, dan heb je geen DPA nodig; gebruikt de leverancier de gegevens voor de eigen dienst, zoals een vervoerder, dan is die zelf verantwoordelijk; anders zoek je de DPA en bewaar en registreer je hem" data-bijschrift="Zo bepaal je of je een verwerkersovereenkomst nodig hebt, stand 2 november 2026." font-family="Inter, system-ui, sans-serif" fill="#23261D"><defs>
