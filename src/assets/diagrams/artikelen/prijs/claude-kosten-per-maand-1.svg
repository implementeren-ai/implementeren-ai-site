 y="304" font-size="34" font-weight="600">Usage</text><text x="360" y="348" font-size="34" font-weight="600">credits</text><text x="360" y="396" font-size="26" fill="#565A4C">met een</text><text x="360" y="428" font-size="26" fill="#565A4C">maandlimiet</text><rect x="608" y="196" width="248" height="260" rx="14" fill="#F6E7E4" stroke="#E4C8C3" stroke-width="4" /><text x="632" y="256" font-size="26" fill="#565A4C">bij Enterprise</text><text x="632" y="304" font-size="34" font-weight="600">Verbruik</text><text x="632" y="396" font-size="26" fill="#A8433B">kan niet uit,</text><text x="632" y="428" font-size="26" fill="#A8433B">wel begrenzen</text><rect x="888" y="196" width="248" height="260" rx="14" fill="#FFFFFF" stroke="#23261D" stroke-width="4" /><rect x="912" y="216" width="72" height="8" rx="4" fill="#B4C13E"/><text x="912" y="256" font-size="26" fill="#565A4C">bij Team</text><text x="912" y="304" font-size="34" font-weight="600">API-credits</text><text x="912" y="396" font-size="26" fill="#565A4C">max $500</text><text x="912" y="428" font-size="26" fill="#565A4C">per maand</text><rect x="64" y="478" width="1072" height="56" rx="12" fill="none" stroke="#CFCDBE" stroke-width="4" stroke-dasharray="10 10"/><text x="600" y="517" text-anchor="middle" font-size="32" font-weight="600">eenmalig · implementatie</text><text x="1136" y="566" text-anchor="end" font-size="26" fill="#64685A">stand 2 nov 2026</text><rect width="1200" height="600" filter="url(#kpm1g)"/></svg>
